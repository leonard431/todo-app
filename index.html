
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>My To-Do List <span>✦</span></h1>
        </header>

        <section class="task-panel">
            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a todo"
                    autocomplete="off"
                    aria-label="Enter a new task"
                    required
                >
                <button type="submit" class="add-btn">+ Add</button>
            </form>

            <div class="task-summary">
                <div>
                    <span id="remainingCount">0</span>
                    <span> tasks left</span>
                </div>
                <div>
                    <span id="completedCount">0</span>
                    <span> completed</span>
                </div>
            </div>

            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <nav class="filters" aria-label="Filter tasks">
                <button type="button" class="filter-btn active" data-filter="all">All Tasks</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </nav>

            <p id="message" role="status"></p>
            <ul id="taskList" aria-label="Your tasks"></ul>

            <button type="button" id="clearCompleted" class="clear-btn">
                Clear completed tasks
            </button>
        </section>

    </main>
</body>
</html>
